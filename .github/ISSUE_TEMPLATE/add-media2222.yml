name: Adicionar à biblioteca
description: Adiciona um filme, série, anime ou livro
title: "[Adicionar] "
labels: ["add-media"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Tipo
      options:
        - Filme
        - Série
        - Anime
        - Livro
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Título
      placeholder: "Ex.: Frieren"
    validations:
      required: true
  - type: input
    id: year
    attributes:
      label: Ano (opcional)
      description: Ajuda a distinguir versões (ex. Dune 1984 vs 2021).
  - type: input
    id: ext_id
    attributes:
      label: ID externo (opcional)
      description: "Para forçar um resultado exato: tmdb:438631, anilist:154587 ou ol:OL893415W"
  - type: dropdown
    id: status
    attributes:
      label: Estado
      options:
        - Quero ver/ler
        - A ver/ler
        - Concluído
        - Abandonado
    validations:
      required: true
  - type: input
    id: rating
    attributes:
      label: Nota (opcional)
      description: De 0 a 10, aceita decimais (ex. 8.5).
  - type: textarea
    id: review
    attributes:
      label: Review (opcional)
