name: Deploy site

on:
  push:
    branches: [main]
    paths: ["media/**", "data/**", "site-src/**", "scripts/build-site.mjs"]
  # Commits feitos com o GITHUB_TOKEN NÃO disparam o "push" acima,
  # por isso reagimos ao fim do workflow "Add media".
  workflow_run:
    workflows: ["Add media", "Remove media", "Edit media", "AI enrich"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
