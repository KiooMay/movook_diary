name: Deploy site
on:
  push:
    branches: [main]
    paths: ["media/**", "data/**", "site-src/**", "scripts/build-site.mjs"]
  workflow_run:
    workflows: ["Add media", "Remove media", "Edit media", "AI enrich"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check site-src/importer.mjs
      - run: node scripts/build-site.mjs
      - name: Connect account importer
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path='_site/index.html';
          let html=fs.readFileSync(path,'utf8');
          const needle='sb = createClient(SUPABASE_URL, SUPABASE_KEY);';
          if(!html.includes(needle)||!html.includes('</body>')) throw Error('Importer integration target missing');
          html=html.replace(needle,needle+' window.__movookClient = sb;');
          html=html.replace('</body>','<script type="module" src="importer.mjs"></script>\n</body>');
          fs.writeFileSync(path,html);
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
