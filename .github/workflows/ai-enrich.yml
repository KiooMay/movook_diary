name: AI enrich

on:
  workflow_run:
    workflows: ["Add media"]
    types: [completed]
  schedule:
    - cron: "0 7 * * *"   # diário: trata pendentes (a quota gratuita repõe-se todos os dias)
    - cron: "0 8 * * 1"   # segundas: recomendações e resumo do ano
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-enrich
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  # Opcional: outro fornecedor gratuito compatível com a API da OpenAI
  AI_BASE_URL: ${{ vars.AI_BASE_URL }}
  AI_API_KEY: ${{ secrets.AI_API_KEY }}
  AI_MODEL: ${{ vars.AI_MODEL }}

jobs:
  enrich:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sinopses PT, géneros e tags
        run: node scripts/ai-items.mjs

      - name: Recomendações e resumo
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * 1') }}
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/ai-insights.mjs

      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "media-bot"
          git config user.email "media-bot@users.noreply.github.com"
          BR="$(git rev-parse --abbrev-ref HEAD)"
          git add -A media data
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "ai: update synopses, tags and insights"
          for i in 1 2 3 4; do
            # Se alguém editou o mesmo ficheiro entretanto, a edição dessa pessoa ganha
            # (o que a AI não conseguiu aplicar fica para a próxima execução)
            if git pull --rebase -X ours -q origin "$BR" && git push -q origin "HEAD:$BR"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done
          echo "Não consegui guardar." >&2
          exit 1
