name: Edit media

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Sem "concurrency": vários pedidos podem correr ao mesmo tempo (o GitHub descartaria
# pedidos pendentes). Os conflitos de gravação são resolvidos em apply-and-push.sh.

jobs:
  edit:
    # Só corre para issues com o label certo E criadas por ti (repo público!)
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'edit-media')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply change and push
        env:
          # O corpo vai por variável de ambiente, nunca interpolado na shell
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: bash scripts/apply-and-push.sh node scripts/edit-media.mjs

      - name: Comment and close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment.md
          gh issue close "$ISSUE_NUMBER"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "❌ Algo correu mal. Vê os logs: $RUN_URL"
