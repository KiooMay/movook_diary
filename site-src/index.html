<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14141a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MOVOOK">
<title>MOVOOK</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1c1c22;--muted:#6b6b76;--line:#e2e0da;--accent:#5b4bdb;--star:#e0a100;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14141a;--card:#1e1e26;--text:#ececf1;--muted:#9a9aa8;--line:#2e2e3a;--accent:#8b7dff;--star:#f2b827;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center;padding:1rem 1rem .5rem;max-width:1100px;margin:auto}
h1{font-size:1.3rem;margin:0}
button,select,input{font:inherit;color:inherit}
nav button,.tabs button{background:none;border:1px solid var(--line);border-radius:999px;padding:.3rem .9rem;cursor:pointer}
nav button.on,.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1100px;margin:auto;padding:0 1rem 3rem}
.tabs{display:flex;gap:.5rem;overflow-x:auto;padding:.5rem 0}
.tabs button{white-space:nowrap}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem;margin:.5rem 0 1rem}
.controls input,.controls select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.cover{aspect-ratio:2/3;background:var(--line);position:relative;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:2rem}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.75);color:#fff;border-radius:8px;padding:0 .4rem;font-size:.8rem}
.badge b{color:var(--star)}
.info{padding:.5rem .6rem .6rem}
.info strong{display:block;font-size:.92rem;line-height:1.25}
.info small{color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);max-width:640px;width:calc(100% - 2rem);padding:0;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.m{padding:1.2rem;display:grid;gap:.8rem}
.m .top{display:flex;gap:1rem}
.m .top img{width:110px;border-radius:8px;align-self:flex-start}
.m h2{margin:0;font-size:1.25rem}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{border:1px solid var(--line);border-radius:999px;padding:0 .6rem;font-size:.8rem;color:var(--muted)}
.txt{white-space:pre-wrap}
.m h3{margin:.2rem 0 0;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.close{justify-self:end;background:none;border:1px solid var(--line);border-radius:8px;padding:.2rem .7rem;cursor:pointer}
a{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem}
.stat b{font-size:1.6rem;display:block}
.stat span,.muted{color:var(--muted);font-size:.85rem}
.bar{display:grid;grid-template-columns:110px 1fr 30px;gap:.5rem;align-items:center;margin:.3rem 0;font-size:.9rem}
.bar i{display:block;height:10px;border-radius:6px;background:var(--accent)}
h2.sec{font-size:1rem;margin:1.5rem 0 .5rem}
nav{display:flex;gap:.4rem;flex-wrap:wrap}
.btn{border:1px solid var(--accent);border-radius:999px;padding:.3rem .9rem;text-decoration:none;color:var(--accent);font-size:1rem}
.danger{color:#d64545}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:.6rem 1rem;border-radius:10px;z-index:100;max-width:90%;text-align:center}
.form{display:grid;gap:.7rem}
.form label{display:grid;gap:.25rem;font-size:.85rem;color:var(--muted)}
.form input,.form select,.form textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;width:100%;color:var(--text)}
.form textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:.5rem;justify-content:flex-end}
button.btn{background:none;cursor:pointer}
button.btn.fill{background:var(--accent);color:#fff}
.btn.danger{border-color:#d64545}
button:disabled{opacity:.6;cursor:wait}
.chip.tag{cursor:pointer;background:none;font:inherit;font-size:.8rem;color:var(--accent);border-color:var(--accent)}
.recs{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.recs .stat{display:grid;gap:.4rem;align-content:start}
</style>
<link rel="stylesheet" href="custom.css">
</head>
<body>
<header>
  <h1>📚 MOVOOK</h1>
  <nav>
    <button data-view="library" class="on">Biblioteca</button>
    <button data-view="stats">Estatísticas</button>
    <a id="addLink" class="btn" hidden target="_blank" rel="noopener">+ Adicionar</a>
    <button id="addBtn" class="btn" hidden>+ Adicionar</button>
    <button id="refreshBtn" title="Atualizar" aria-label="Atualizar">↻</button>
    <button id="cfgBtn" title="Definições" aria-label="Definições">⚙</button>
  </nav>
</header>
<main>
  <section id="library">
    <div class="tabs" id="types"></div>
    <div class="controls">
      <input id="q" type="search" placeholder="Pesquisar título, autor, tag…" aria-label="Pesquisar">
      <select id="status" aria-label="Estado"></select>
      <select id="genre" aria-label="Género"></select>
      <select id="tag" aria-label="Tag"></select>
      <select id="sort" aria-label="Ordenar"></select>
    </div>
    <div id="grid" class="grid"></div>
    <p id="empty" class="muted" hidden>Nada encontrado.</p>
  </section>
  <section id="stats" hidden><div id="insights"></div><div id="statsBody"></div></section>
</main>
<dialog id="modal"></dialog>
<dialog id="formDlg"></dialog>
<div id="toast" class="toast" hidden></div>

<script>
const TYPES = { all: 'Tudo', movie: 'Filmes', series: 'Séries', anime: 'Animes', book: 'Livros' };
const STATUS = { planned: 'Quero ver/ler', 'in-progress': 'A ver/ler', done: 'Concluído', dropped: 'Abandonado' };
const SORTS = {
  added: ['Mais recentes', (a, b) => (b.date_added || '').localeCompare(a.date_added || '')],
  rating: ['Melhor nota', (a, b) => (b.rating ?? -1) - (a.rating ?? -1)],
  year: ['Ano', (a, b) => (b.year || 0) - (a.year || 0)],
  title: ['Título A–Z', (a, b) => (a.title || '').localeCompare(b.title || '', 'pt')],
};
const ICON = { movie: '🎬', series: '📺', anime: '🌸', book: '📖' };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": '&#39;' }[c]));
const safeUrl = (u) => (/^(https?:\/\/|covers\/)/i.test(u || '') ? esc(u) : '');
// Repo deduzido do endereço do GitHub Pages (utilizador.github.io/repo/)
const REPO = (() => {
  const h = location.hostname, p = location.pathname.split('/')[1];
  return h.endsWith('.github.io') && p ? `https://github.com/${h.split('.')[0]}/${p}` : null;
})();
const fmtRating = (r) => (r == null ? '' : Number.isInteger(r) ? r : r.toFixed(1));

let items = [];
const state = { type: 'all', q: '', status: '', genre: '', tag: '', sort: 'added' };

function lengthText(l) {
  if (!l) return '';
  const p = [];
  if (l.runtime_min) p.push(`${l.runtime_min} min`);
  if (l.seasons) p.push(`${l.seasons} temp.`);
  if (l.episodes) p.push(`${l.episodes} ep.`);
  if (l.pages) p.push(`${l.pages} págs.`);
  return p.join(' · ');
}

function fillSelect(el, entries) {
  el.innerHTML = entries.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
}

function setupControls() {
  $('#types').innerHTML = Object.entries(TYPES)
    .map(([k, v]) => `<button data-type="${k}" class="${k === state.type ? 'on' : ''}">${v}</button>`).join('');
  fillSelect($('#status'), [['', 'Todos os estados'], ...Object.entries(STATUS)]);
  const genres = [...new Set(items.flatMap((i) => i.genres))].sort((a, b) => a.localeCompare(b, 'pt'));
  fillSelect($('#genre'), [['', 'Todos os géneros'], ...genres.map((g) => [g, g])]);
  const counts = {};
  items.forEach((i) => i.tags.forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
  const tags = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pt'));
  fillSelect($('#tag'), [['', 'Todas as tags'], ...tags.map(([t, n]) => [t, `${t} (${n})`])]);
  $('#tag').hidden = tags.length === 0;
  fillSelect($('#sort'), Object.entries(SORTS).map(([k, v]) => [k, v[0]]));
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return items
    .filter((i) => state.type === 'all' || i.type === state.type)
    .filter((i) => !state.status || i.status === state.status)
    .filter((i) => !state.genre || i.genres.includes(state.genre))
    .filter((i) => !state.tag || i.tags.includes(state.tag))
    .filter((i) => !q || [i.title, i.original_title, ...i.creators, ...i.tags].join(' ').toLowerCase().includes(q))
    .sort(SORTS[state.sort][1]);
}

function renderGrid() {
  const list = filtered();
  $('#empty').hidden = list.length > 0;
  $('#grid').innerHTML = list.map((i) => `
    <button class="card" data-id="${esc(i.id)}">
      <div class="cover">
        ${safeUrl(i.cover) ? `<img src="${safeUrl(i.cover)}" alt="" loading="lazy">` : ICON[i.type] || '📁'}
        ${i.rating != null ? `<span class="badge"><b>★</b> ${fmtRating(i.rating)}</span>` : ''}
      </div>
      <div class="info"><strong>${esc(i.title)}</strong>
        <small>${esc(i.year || '')} · ${esc(STATUS[i.status] || '')}</small></div>
    </button>`).join('');
}

function openModal(id) {
  const i = items.find((x) => x.id === id);
  if (!i) return;
  const chips = i.genres.map((g) => `<span class="chip">${esc(g)}</span>`).join('') +
    i.tags.map((t) => `<button class="chip tag" data-tag="${esc(t)}" title="Ver todos com esta tag">#${esc(t)}</button>`).join('');
  $('#modal').innerHTML = `<div class="m">
    <button class="close" data-close>Fechar</button>
    <div class="top">
      ${safeUrl(i.cover) ? `<img src="${safeUrl(i.cover)}" alt="">` : ''}
      <div>
        <h2>${esc(i.title)}</h2>
        <div class="muted">${esc([i.original_title !== i.title ? i.original_title : '', i.year, lengthText(i.length)].filter(Boolean).join(' · '))}</div>
        <div class="muted">${esc(i.creators.join(', '))}</div>
        <p><b style="color:var(--star)">★</b> ${i.rating != null ? fmtRating(i.rating) + '/10' : 'sem nota'} · ${esc(STATUS[i.status] || '')}
        ${i.date_finished ? `<br><span class="muted">Terminado em ${esc(i.date_finished)}</span>` : ''}</p>
      </div>
    </div>
    <div class="chips">${chips}</div>
    ${i.review ? `<h3>A minha review</h3><div class="txt">${esc(i.review)}</div>` : ''}
    ${i.synopsis ? `<h3>Sinopse</h3><div class="txt">${esc(i.synopsis)}</div>` : ''}
    ${safeUrl(i.source_url) ? `<a href="${safeUrl(i.source_url)}" target="_blank" rel="noopener">Ver na fonte ↗</a>` : ''}
    ${apiReady()
      ? `<div class="row" style="justify-content:flex-start"><button class="btn" data-edit="${esc(i.id)}">✏️ Editar</button><button class="btn danger" data-remove="${esc(i.id)}">🗑 Remover</button></div>`
      : REPO ? `<a class="danger" href="${REPO}/issues/new?template=remove-media.yml&items=${encodeURIComponent(i.id)}" target="_blank" rel="noopener">🗑 Remover da biblioteca</a>` : ''}
  </div>`;
  $('#modal').showModal();
}

function renderStats() {
  const done = items.filter((i) => i.status === 'done');
  const rated = items.filter((i) => i.rating != null);
  const avg = rated.length ? rated.reduce((s, i) => s + i.rating, 0) / rated.length : null;
  const year = String(new Date().getFullYear());
  const thisYear = done.filter((i) => String(i.date_finished || '').startsWith(year));
  const count = (arr, f) => arr.reduce((m, i) => (f(i).forEach((k) => (m[k] = (m[k] || 0) + 1)), m), {});
  const bars = (obj, n = 8) => {
    const e = Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, n);
    const max = e[0]?.[1] || 1;
    return e.map(([k, v]) => `<div class="bar"><span>${esc(k)}</span><i style="width:${(v / max) * 100}%"></i><span>${v}</span></div>`).join('') || '<p class="muted">Sem dados.</p>';
  };
  const gAvg = {};
  rated.forEach((i) => i.genres.forEach((g) => (gAvg[g] = gAvg[g] || []).push(i.rating)));
  const gAvgBest = Object.entries(gAvg).filter(([, v]) => v.length >= 2)
    .map(([g, v]) => [g, +(v.reduce((a, b) => a + b, 0) / v.length).toFixed(1)]);
  $('#statsBody').innerHTML = `
    <div class="stats">
      <div class="stat"><b>${items.length}</b><span>itens na biblioteca</span></div>
      <div class="stat"><b>${done.length}</b><span>concluídos</span></div>
      <div class="stat"><b>${thisYear.length}</b><span>concluídos em ${year}</span></div>
      <div class="stat"><b>${avg == null ? '–' : avg.toFixed(1)}</b><span>nota média</span></div>
    </div>
    <h2 class="sec">Por tipo</h2>${bars(count(items, (i) => [TYPES[i.type] || i.type]))}
    <h2 class="sec">Géneros mais frequentes</h2>${bars(count(items, (i) => i.genres))}
    <h2 class="sec">Géneros com melhor nota média <span class="muted">(mín. 2 itens avaliados)</span></h2>
    ${gAvgBest.sort((a, b) => b[1] - a[1]).slice(0, 8).map(([g, v]) => `<div class="bar"><span>${esc(g)}</span><i style="width:${v * 10}%"></i><span>${v}</span></div>`).join('') || '<p class="muted">Sem dados.</p>'}`;
}

function bind() {
  $('#types').addEventListener('click', (e) => {
    const t = e.target.closest('[data-type]'); if (!t) return;
    state.type = t.dataset.type;
    document.querySelectorAll('#types button').forEach((b) => b.classList.toggle('on', b === t));
    renderGrid();
  });
  $('#q').addEventListener('input', (e) => { state.q = e.target.value; renderGrid(); });
  for (const k of ['status', 'genre', 'tag', 'sort']) $('#' + k).addEventListener('change', (e) => { state[k] = e.target.value; renderGrid(); });
  $('#grid').addEventListener('click', (e) => { const c = e.target.closest('[data-id]'); if (c) openModal(c.dataset.id); });
  $('#modal').addEventListener('click', (e) => { if (e.target === e.currentTarget || e.target.hasAttribute('data-close')) $('#modal').close(); });
  document.querySelectorAll('nav button[data-view]').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('nav button[data-view]').forEach((x) => x.classList.toggle('on', x === b));
    $('#library').hidden = b.dataset.view !== 'library';
    $('#stats').hidden = b.dataset.view !== 'stats';
  }));
}

// ---------- ligação ao Worker (adicionar/remover sem sair da app) ----------
const CFG_KEY = 'mobook.cfg';
function getCfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch { return {}; } }
function apiReady() { const c = getCfg(); return !!(c.url && c.secret); }

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 6000);
}

async function api(path, payload) {
  const c = getCfg();
  let res;
  try {
    res = await fetch(c.url.replace(/\/+$/, '') + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + c.secret },
      body: JSON.stringify(payload),
    });
  } catch { throw new Error('Sem ligação ao servidor (estás offline?)'); }
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || `Erro ${res.status}`);
  return j;
}

function refreshActions() {
  const ready = apiReady();
  $('#addBtn').hidden = !ready;
  $('#addLink').hidden = ready || !REPO;
  if (REPO) $('#addLink').href = `${REPO}/issues/new?template=add-media.yml`;
}

const dlg = $('#formDlg');
dlg.addEventListener('click', (e) => { if (e.target === dlg || e.target.hasAttribute('data-cancel')) dlg.close(); });

function openAdd() {
  dlg.innerHTML = `<form class="m form" id="addForm">
    <h2>Adicionar à biblioteca</h2>
    <label>Tipo<select id="fType">
      <option value="movie">Filme</option><option value="series">Série</option>
      <option value="anime">Anime</option><option value="book">Livro</option></select></label>
    <label>Títulos (um por linha, máx. 30)<textarea id="fTitles" required placeholder="Frieren&#10;Dune | 2021"></textarea></label>
    <label>Estado<select id="fStatus">
      <option value="planned">Quero ver/ler</option><option value="in-progress">A ver/ler</option>
      <option value="done">Concluído</option><option value="dropped">Abandonado</option></select></label>
    <label>Nota 0–10 (opcional, só com 1 título)<input id="fRating" type="number" min="0" max="10" step="0.1" inputmode="decimal"></label>
    <label>Review (opcional, só com 1 título)<textarea id="fReview"></textarea></label>
    <div class="row"><button type="button" class="btn" data-cancel>Cancelar</button>
      <button type="submit" class="btn fill">Adicionar</button></div></form>`;
  dlg.showModal();
  $('#addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('[type=submit]'); btn.disabled = true;
    const titles = $('#fTitles').value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
    try {
      await api('/add', { type: $('#fType').value, titles, status: $('#fStatus').value, rating: $('#fRating').value, review: $('#fReview').value });
      dlg.close();
      toast(`Pedido enviado (${titles.length}). O site atualiza em 1–2 min; depois toca em ↻.`);
    } catch (err) { btn.disabled = false; toast('Erro: ' + err.message); }
  });
}

function openCfg() {
  const c = getCfg();
  dlg.innerHTML = `<form class="m form" id="cfgForm">
    <h2>Definições</h2>
    <p class="muted">Para adicionar e remover a partir da app. Fica guardado só neste dispositivo.</p>
    <label>Endereço do Worker<input id="cUrl" type="url" placeholder="https://mobook-api.xxx.workers.dev"></label>
    <label>Passphrase<input id="cSecret" type="password" autocomplete="off"></label>
    <div class="row"><button type="button" class="btn danger" id="cClear">Limpar</button>
      <button type="button" class="btn" data-cancel>Cancelar</button>
      <button type="submit" class="btn fill">Guardar</button></div></form>`;
  $('#cUrl').value = c.url || ''; $('#cSecret').value = c.secret || '';
  dlg.showModal();
  $('#cfgForm').addEventListener('submit', (e) => {
    e.preventDefault();
    localStorage.setItem(CFG_KEY, JSON.stringify({ url: $('#cUrl').value.trim(), secret: $('#cSecret').value }));
    dlg.close(); refreshActions(); toast('Guardado.');
  });
  $('#cClear').addEventListener('click', () => { localStorage.removeItem(CFG_KEY); dlg.close(); refreshActions(); toast('Definições removidas.'); });
}

$('#modal').addEventListener('click', (e) => {
  const t = e.target.dataset?.tag; if (t === undefined) return;
  Object.assign(state, { type: 'all', q: '', status: '', genre: '', tag: t });
  $('#q').value = ''; $('#status').value = ''; $('#genre').value = ''; $('#tag').value = t;
  document.querySelectorAll('#types button').forEach((b) => b.classList.toggle('on', b.dataset.type === 'all'));
  $('#modal').close();
  document.querySelector('nav button[data-view=library]').click();
  renderGrid(); window.scrollTo(0, 0);
});

function openEdit(id) {
  const it = items.find((x) => x.id === id); if (!it) return;
  dlg.innerHTML = `<form class="m form" id="editForm">
    <h2>Editar</h2><div class="muted" id="eTitle"></div>
    <label>Estado<select id="eStatus">
      <option value="planned">Quero ver/ler</option><option value="in-progress">A ver/ler</option>
      <option value="done">Concluído</option><option value="dropped">Abandonado</option></select></label>
    <label>Nota 0–10<input id="eRating" type="number" min="0" max="10" step="0.1" inputmode="decimal"></label>
    <label>Data de conclusão<input id="eDate" type="date"></label>
    <label>Tags (separadas por vírgulas)<input id="eTags" type="text" placeholder="slow burn, sci-fi filosófico"></label>
    <label>Review<textarea id="eReview" style="min-height:140px"></textarea></label>
    <div class="row"><button type="button" class="btn" data-cancel>Cancelar</button>
      <button type="submit" class="btn fill">Guardar</button></div></form>`;
  $('#eTitle').textContent = it.title;
  $('#eStatus').value = it.status || 'planned';
  $('#eRating').value = it.rating ?? '';
  $('#eDate').value = /^\d{4}-\d{2}-\d{2}$/.test(it.date_finished || '') ? it.date_finished : '';
  $('#eTags').value = it.tags.join(', ');

<script>
(() => {
  const FAV_KEY = 'mobook.favorites';
  const SHELF_KEY = 'mobook.shelves';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": '&#39;' }[c]));
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const store = (k, v) => localStorage.setItem(k, JSON.stringify(v));
  let favs = new Set(load(FAV_KEY, []));
  let shelves = load(SHELF_KEY, []);
  let shelfItems = [];
  let activeShelf = 'favorites';
  const ICON = { movie: '🎬', series: '📺', anime: '🌸', book: '📖' };
  const STATUS = { planned: 'Quero ver/ler', 'in-progress': 'A ver/ler', done: 'Concluído', dropped: 'Abandonado' };
  const fmtRating = (r) => (r == null ? '' : Number.isInteger(r) ? r : r.toFixed(1));

  const style = document.createElement('style');
  style.textContent = `
    #shelves .shelfrow{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.4rem 0}
    #shelves .shelfitem{display:flex;gap:.4rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.4rem .6rem}
    #shelves .shelfitem b{font-size:.95rem}
    .favstar{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.65);color:#fff;border-radius:8px;padding:0 .45rem;font-size:1rem;cursor:pointer;z-index:2;line-height:1.6}
    .favstar.on{color:#e0245e}
    .favgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem;margin-top:1rem}
  `;
  document.head.appendChild(style);

  const saveFavs = () => store(FAV_KEY, [...favs]);
  const saveShelves = () => store(SHELF_KEY, shelves);

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    setTimeout(() => (t.hidden = true), 4000);
  }

  const nav = document.querySelector('header nav');
  const shelvesBtn = document.createElement('button');
  shelvesBtn.id = 'shelvesBtn';
  shelvesBtn.dataset.view = 'shelves';
  shelvesBtn.textContent = 'Estantes';
  nav.querySelector('button[data-view=stats]').after(shelvesBtn);

  const sec = document.createElement('section');
  sec.id = 'shelves'; sec.hidden = true;
  sec.innerHTML = '<div id="shelvesBody"></div>';
  document.querySelector('main').insertBefore(sec, document.getElementById('stats'));

  function showView(name) {
    document.querySelectorAll('nav button[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === name));
    $('#library').hidden = name !== 'library';
    $('#stats').hidden = name !== 'stats';
    $('#shelves').hidden = name !== 'shelves';
    if (name === 'shelves') renderShelves();
  }

  shelvesBtn.addEventListener('click', () => showView('shelves'));
  document.querySelectorAll('nav button[data-view]').forEach((b) => b.addEventListener('click', () => {
    $('#shelves').hidden = b.dataset.view !== 'shelves';
    if (b.dataset.view === 'shelves') renderShelves();
  }));

  function currentFilter() {
    return {
      type: document.querySelector('#types button.on')?.dataset.type || 'all',
      q: $('#q').value, status: $('#status').value, genre: $('#genre').value,
      tag: $('#tag').value, sort: $('#sort').value,
    };
  }

  function applyShelf(sh) {
    showView('library');
    $('#q').value = sh.filter.q || '';
    $('#q').dispatchEvent(new Event('input'));
    for (const k of ['status', 'genre', 'tag', 'sort']) {
      const el = $('#' + k); el.value = sh.filter[k] || '';
      el.dispatchEvent(new Event('change'));
    }
    document.querySelector(`#types button[data-type="${sh.filter.type || 'all'}"]`)?.click();
    window.scrollTo(0, 0);
  }

  function cardHTML(i) {
    return `<button class="card" data-id="${esc(i.id)}">
      <div class="cover">
        ${i.cover ? `<img src="${esc(i.cover)}" alt="" loading="lazy">` : ICON[i.type] || '📁'}
        ${i.rating != null ? `<span class="badge"><b>★</b> ${fmtRating(i.rating)}</span>` : ''}
      </div>
      <div class="info"><strong>${esc(i.title)}</strong>
        <small>${esc(i.year || '')} · ${esc(STATUS[i.status] || '')}</small></div>
    </button>`;
  }

  function renderShelves() {
    const favItems = shelfItems.filter((i) => favs.has(i.id));
    const shelfList = shelves.map((s) => `
      <div class="shelfitem">
        <b>${esc(s.name)}</b>
        <button class="btn" data-apply="${esc(s.id)}">Abrir</button>
        <button class="btn danger" data-del="${esc(s.id)}">Eliminar</button>
      </div>`).join('');
    $('#shelvesBody').innerHTML = `
      <h2 class="sec">Estantes</h2>
      <div class="shelfrow">
        <button class="btn ${activeShelf === 'favorites' ? 'fill' : ''}" id="favShelf">♥ Favoritos (${favItems.length})</button>
        <button class="btn" id="saveShelf">Guardar filtros atuais</button>
      </div>
      ${shelves.length ? `<h2 class="sec">Filtros guardados</h2><div class="shelfrow">${shelfList}</div>` : '<p class="muted">Ainda não tens filtros guardados. Aplica filtros na Biblioteca e volta aqui para os guardar.</p>'}
      ${activeShelf === 'favorites' ? `<h2 class="sec">♥ Favoritos</h2><div class="favgrid">${favItems.map(cardHTML).join('') || '<p class="muted">Ainda não favoritaste nada. Toca no coração de um item na Biblioteca.</p>'}</div>` : ''}`;
  }

  $('#shelves').addEventListener('click', (e) => {
    if (e.target.id === 'favShelf') { activeShelf = 'favorites'; renderShelves(); return; }
    if (e.target.id === 'saveShelf') {
      const name = prompt('Nome da estante / filtro guardado:');
      if (!name) return;
      shelves.push({ id: Date.now(), name: name.trim(), filter: currentFilter() });
      saveShelves(); renderShelves(); toast('Filtros guardados.');
      return;
    }
    const applyId = e.target.dataset?.apply;
    if (applyId) { const sh = shelves.find((s) => String(s.id) === applyId); if (sh) applyShelf(sh); return; }
    const delId = e.target.dataset?.del;
    if (delId) {
      const sh = shelves.find((s) => String(s.id) === delId);
      if (sh && confirm(`Eliminar a estante \"${sh.name}\"?`)) {
        shelves = shelves.filter((s) => String(s.id) !== delId);
        saveShelves(); renderShelves();
      }
      return;
    }
    const card = e.target.closest('.card[data-id]');
    if (card) {
      showView('library');
      $('#q').value = ''; $('#q').dispatchEvent(new Event('input'));
      for (const k of ['status', 'genre', 'tag']) { const el = $('#' + k); el.value = ''; el.dispatchEvent(new Event('change')); }
      document.querySelector('#types button[data-type="all"]')?.click();
      document.querySelector(`#grid .card[data-id="${card.dataset.id}"]`)?.click();
    }
  });

  function toggleFav(id) {
    if (favs.has(id)) favs.delete(id); else favs.add(id);
    saveFavs();
    document.querySelectorAll(`#grid .card[data-id="${id}"] .favstar`).forEach((s) => {
      s.classList.toggle('on', favs.has(id)); s.textContent = favs.has(id) ? '♥' : '♡';
    });
    const mt = $('#modal .favtoggle');
    if (mt && mt.dataset.id === id) { mt.textContent = favs.has(id) ? '♥ Favorito' : '♡ Favoritar'; }
    if (!$('#shelves').hidden) renderShelves();
    toast(favs.has(id) ? 'Adicionado aos Favoritos.' : 'Removido dos Favoritos.');
  }

  function decorate() {
    document.querySelectorAll('#grid .card[data-id]').forEach((card) => {
      const cover = card.querySelector('.cover');
      if (!cover || cover.querySelector('.favstar')) return;
      const id = card.dataset.id;
      const s = document.createElement('span');
      s.className = 'favstar' + (favs.has(id) ? ' on' : '');
      s.textContent = favs.has(id) ? '♥' : '♡';
      s.title = 'Favorito';
      s.addEventListener('click', (e) => { e.stopPropagation(); toggleFav(id); });
      cover.appendChild(s);
    });
    const m = $('#modal .m');
    if (m && !m.querySelector('.favtoggle')) {
      const ref = m.querySelector('[data-edit],[data-remove]');
      const id = ref?.dataset.edit || ref?.dataset.remove;
      if (id) {
        const b = document.createElement('button');
        b.className = 'btn favtoggle'; b.dataset.id = id;
        b.textContent = favs.has(id) ? '♥ Favorito' : '♡ Favoritar';
        b.addEventListener('click', () => toggleFav(id));
        const row = m.querySelector('.row');
        if (row) row.insertBefore(b, row.firstChild); else m.appendChild(b);
      }
    }
  }

  let decorating = false;
  const obs = new MutationObserver(() => {
    if (decorating) return;
    decorating = true;
    queueMicrotask(() => { decorate(); decorating = false; });
  });
  obs.observe($('#grid'), { childList: true });
  obs.observe($('#modal'), { childList: true, subtree: true });

  function loadShelfData() {
    return fetch('data.json', { cache: 'no-cache' }).then((r) => r.json()).then((d) => { shelfItems = d.items || []; });
  }
  loadShelfData().then(() => { if (!$('#shelves').hidden) renderShelves(); });
  $('#refreshBtn').addEventListener('click', () => loadShelfData().then(() => { if (!$('#shelves').hidden) renderShelves(); }));
})();
</script>

  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });

  acctBtn.addEventListener('click', () => { renderAccount(); dlg.showModal(); });

  function renderAccount(msg = '', err = '') {
    if (user) {
      dlg.innerHTML = `<div class="m form">
        <h2>Conta</h2>
        <p class="muted">Sessão iniciada como <b>${esc(user.email)}</b>.</p>
        <p class="muted">Favoritos e estantes guardados estão sincronizados com a tua conta.</p>
        ${msg ? `<p class="muted">${esc(msg)}</p>` : ''}${err ? `<p class="danger">${esc(err)}</p>` : ''}
        <div class="row"><button class="btn danger" id="signOut">Sair</button>
        <button class="btn" data-close>Fechar</button></div></div>`;
      $('#signOut').addEventListener('click', async () => {
        await sb.auth.signOut();
        dlg.close(); toast('Sessão terminada.');
      });
    } else {
      dlg.innerHTML = `<form class="m form" id="authForm">
        <h2>Conta</h2>
        <p class="muted">Entra para sincronizar favoritos e estantes entre dispositivos.</p>
        <label>Email<input id="aEmail" type="email" required autocomplete="email"></label>
        <label>Password<input id="aPass" type="password" required minlength="6" autocomplete="current-password"></label>
        ${msg ? `<p class="muted">${esc(msg)}</p>` : ''}${err ? `<p class="danger">${esc(err)}</p>` : ''}
        <div class="row"><button type="button" class="btn" data-close>Fechar</button>
        <button type="button" class="btn" id="signUp" disabled>Criar conta</button>
        <button type="submit" class="btn fill" id="signIn" disabled>Entrar</button></div></form>`;
      const emailEl = $('#aEmail'), passEl = $('#aPass');
      const inBtn = $('#signIn'), upBtn = $('#signUp');
      const check = () => {
        const ok = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(emailEl.value.trim()) && passEl.value.length >= 6;
        inBtn.disabled = !ok; upBtn.disabled = !ok;
      };
      emailEl.addEventListener('input', check);
      passEl.addEventListener('input', check);
      check();
      $('#authForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        await auth(emailEl.value.trim(), passEl.value, false);
      });
      upBtn.addEventListener('click', async () => {
        await auth(emailEl.value.trim(), passEl.value, true);
      });
    }
    dlg.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => dlg.close()));
  }

  async function auth(email, pass, signUp) {
    if (!email || !pass || pass.length < 6) {
      renderAccount('', 'Preenche um email válido e uma password com pelo menos 6 caracteres.');
      return;
    }
    const btn = dlg.querySelector('.fill'); btn.disabled = true;
    try {
      const res = signUp ? await sb.auth.signUp({ email, password: pass }) : await sb.auth.signInWithPassword({ email, password: pass });
      if (res.error) throw res.error;
      if (signUp && !res.data.session) { renderAccount('Conta criada. Confirma o email, se o Supabase pedir confirmação, e depois entra.'); return; }
      setUser(res.data.user); dlg.close(); toast('Sessão iniciada.');
    } catch (err) { btn.disabled = false; renderAccount('', err.message); }
  }

  function setUser(u) {
    user = u; initialSyncDone = false;
    acctBtn.textContent = user ? user.email.split('@')[0] : 'Conta';
    if (user) syncAll();
  }

  async function syncAll() {
    if (!user || syncing) return;
    syncing = true;
    try {
      await syncFavorites();
      await syncShelves();
      initialSyncDone = true;
      pending.fav = pending.shelf = false;
    } catch (err) { console.warn('Sync error', err); }
    finally {
      syncing = false;
      if (pending.fav || pending.shelf) { pending.fav = pending.shelf = false; syncAll(); }
    }
  }

  async function syncFavorites() {
    const local = new Set(load(FAV_KEY));
    const { data, error } = await sb.from('user_favorites').select('item_id').eq('user_id', user.id);
    if (error) throw error;
    const remote = new Set((data || []).map((r) => r.item_id));
    if (!initialSyncDone) {
      const merged = [...new Set([...local, ...remote])];
      const toAdd = [...local].filter((id) => !remote.has(id));
      if (toAdd.length) await sb.from('user_favorites').insert(toAdd.map((id) => ({ user_id: user.id, item_id: id })));
      store(FAV_KEY, JSON.stringify(merged));
      return;
    }
    const toAdd = [...local].filter((id) => !remote.has(id));
    const toDel = [...remote].filter((id) => !local.has(id));
    if (toAdd.length) await sb.from('user_favorites').insert(toAdd.map((id) => ({ user_id: user.id, item_id: id })));
    if (toDel.length) await sb.from('user_favorites').delete().in('item_id', toDel).eq('user_id', user.id);
  }

  async function syncShelves() {
    const local = load(SHELF_KEY);
    const { data, error } = await sb.from('user_shelves').select('*').eq('user_id', user.id);
    if (error) throw error;
    const remote = data || [];
    if (!initialSyncDone) {
      const merged = [...local];
      const remoteNames = new Set(remote.map((r) => r.name));
      const toAdd = local.filter((s) => !remoteNames.has(s.name));
      for (const r of remote) if (!merged.some((s) => s.name === r.name)) merged.push({ id: r.id, name: r.name, filter: r.filter || {} });
      if (toAdd.length) await sb.from('user_shelves').insert(toAdd.map((s) => ({ user_id: user.id, name: s.name, filter: s.filter || {} })));
      store(SHELF_KEY, JSON.stringify(merged));
      return;
    }
    const localNames = new Set(local.map((s) => s.name));
    const remoteNames = new Set(remote.map((r) => r.name));
    const toAdd = local.filter((s) => !remoteNames.has(s.name));
    const toDel = remote.filter((r) => !localNames.has(r.name)).map((r) => r.id);
    if (toAdd.length) await sb.from('user_shelves').insert(toAdd.map((s) => ({ user_id: user.id, name: s.name, filter: s.filter || {} })));
    if (toDel.length) await sb.from('user_shelves').delete().in('id', toDel).eq('user_id', user.id);
  }

  const origSet = localStorage.setItem.bind(localStorage);
  localStorage.setItem = (k, v) => {
    origSet(k, v);
    if (!user) return;
    if (k === FAV_KEY) pending.fav = true;
    if (k === SHELF_KEY) pending.shelf = true;
    if ((pending.fav || pending.shelf) && !syncing) syncAll();
  };

  (async () => {
    try {
      const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
      sb = createClient(SUPABASE_URL, SUPABASE_KEY);
      const { data: { session } } = await sb.auth.getSession();
      setUser(session?.user || null);
      sb.auth.onAuthStateChange((_e, s) => setUser(s?.user || null));
    } catch (err) { console.warn('Supabase unavailable', err); }
  })();
})();
