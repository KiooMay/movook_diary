<!doctype html>\n<html lang=\"pt\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#14141a\">\n<link rel=\"manifest\" href=\"manifest.webmanifest\">\n<link rel=\"icon\" href=\"icons/icon-192.png\">\n<link rel=\"apple-touch-icon\" href=\"icons/apple-touch-icon.png\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-title\" content=\"MOVOOK\">\n<title>MOVOOK</title>\n<style>\n:root{--bg:#f6f5f2;--card:#fff;--text:#1c1c22;--muted:#6b6b76;--line:#e2e0da;--accent:#5b4bdb;--star:#e0a100;color-scheme:light}\n@media (prefers-color-scheme:dark){:root{--bg:#14141a;--card:#1e1e26;--text:#ececf1;--muted:#9a9aa8;--line:#2e2e3a;--accent:#8b7dff;--star:#f2b827;color-scheme:dark}}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}\nheader{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;align-items:center;padding:1rem 1rem .5rem;max-width:1100px;margin:auto}\nh1{font-size:1.3rem;margin:0}\nbutton,select,input{font:inherit;color:inherit}\nnav button,.tabs button{background:none;border:1px solid var(--line);border-radius:999px;padding:.3rem .9rem;cursor:pointer}\nnav button.on,.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}\nmain{max-width:1100px;margin:auto;padding:0 1rem 3rem}\n.tabs{display:flex;gap:.5rem;overflow-x:auto;padding:.5rem 0}\n.tabs button{white-space:nowrap}\n.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem;margin:.5rem 0 1rem}\n.controls input,.controls select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;width:100%}\n.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem}\n.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column}\n.cover{aspect-ratio:2/3;background:var(--line);position:relative;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:2rem}\n.cover img{width:100%;height:100%;object-fit:cover;display:block}\n.badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.75);color:#fff;border-radius:8px;padding:0 .4rem;font-size:.8rem}\n.badge b{color:var(--star)}\n.info{padding:.5rem .6rem .6rem}\n.info strong{display:block;font-size:.92rem;line-height:1.25}\n.info small{color:var(--muted)}\ndialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);max-width:640px;width:calc(100% - 2rem);padding:0;max-height:90vh}\ndialog::backdrop{background:rgba(0,0,0,.55)}\n.m{padding:1.2rem;display:grid;gap:.8rem}\n.m .top{display:flex;gap:1rem}\n.m .top img{width:110px;border-radius:8px;align-self:flex-start}\n.m h2{margin:0;font-size:1.25rem}\n.chips{display:flex;flex-wrap:wrap;gap:.3rem}\n.chip{border:1px solid var(--line);border-radius:999px;padding:0 .6rem;font-size:.8rem;color:var(--muted)}\n.txt{white-space:pre-wrap}\n.m h3{margin:.2rem 0 0;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}\n.close{justify-self:end;background:none;border:1px solid var(--line);border-radius:8px;padding:.2rem .7rem;cursor:pointer}\na{color:var(--accent)}\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.8rem}\n.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem}\n.stat b{font-size:1.6rem;display:block}\n.stat span,.muted{color:var(--muted);font-size:.85rem}\n.bar{display:grid;grid-template-columns:110px 1fr 30px;gap:.5rem;align-items:center;margin:.3rem 0;font-size:.9rem}\n.bar i{display:block;height:10px;border-radius:6px;background:var(--accent)}\nh2.sec{font-size:1rem;margin:1.5rem 0 .5rem}\nnav{display:flex;gap:.4rem;flex-wrap:wrap}\n.btn{border:1px solid var(--accent);border-radius:999px;padding:.3rem .9rem;text-decoration:none;color:var(--accent);font-size:1rem}\n.danger{color:#d64545}\n.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:.6rem 1rem;border-radius:10px;z-index:100;max-width:90%;text-align:center}\n.form{display:grid;gap:.7rem}\n.form label{display:grid;gap:.25rem;font-size:.85rem;color:var(--muted)}\n.form input,.form select,.form textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;width:100%;color:var(--text)}\n.form textarea{min-height:90px;resize:vertical}\n.row{display:flex;gap:.5rem;justify-content:flex-end}\nbutton.btn{background:none;cursor:pointer}\nbutton.btn.fill{background:var(--accent);color:#fff}\n.btn.danger{border-color:#d64545}\nbutton:disabled{opacity:.6;cursor:wait}\n.chip.tag{cursor:pointer;background:none;font:inherit;font-size:.8rem;color:var(--accent);border-color:var(--accent)}\n.recs{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}\n.recs .stat{display:grid;gap:.4rem;align-content:start}\n.fav{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:8px;width:26px;height:26px;font-size:.9rem;cursor:pointer;z-index:2}\n.shelf-add{display:flex;gap:.4rem;margin:.4rem 0}\n.shelf-add input,.shelf-add select{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.4rem .6rem}\n</style>\n<link rel=\"stylesheet\" href=\"custom.css\">\n</head>\n<body>\n<header>\n  <h1>MOVOOK</h1>\n  <nav>\n    <button data-view=\"library\" class=\"on\">Biblioteca</button>\n    <button data-view=\"stats\">Estatísticas</button>\n    <a id=\"addLink\" class=\"btn\" hidden target=\"_blank\" rel=\"noopener\">+ Adicionar</a>\n    <button id=\"addBtn\" class=\"btn\" hidden>+ Adicionar</button>\n    <button id=\"refreshBtn\" title=\"Atualizar\" aria-label=\"Atualizar\">↻</button>\n    <button id=\"cfgBtn\" title=\"Definições\" aria-label=\"Definições\">⚙</button>\n  </nav>\n</header>\n<main>\n  <section id=\"library\">\n    <div class=\"tabs\" id=\"types\"></div>\n    <div class=\"controls\">\n      <input id=\"q\" type=\"search\" placeholder=\"Pesquisar título, autor, tag…\" aria-label=\"Pesquisar\">\n      <select id=\"status\" aria-label=\"Estado\"></select>\n      <select id=\"genre\" aria-label=\"Género\"></select>\n      <select id=\"tag\" aria-label=\"Tag\"></select>\n      <select id=\"sort\" aria-label=\"Ordenar\"></select>\n    </div>\n    <div id=\"grid\" class=\"grid\"></div>\n    <p id=\"empty\" class=\"muted\" hidden>Nada encontrado.</p>\n  </section>\n  <section id=\"stats\" hidden><div id=\"insights\"></div><div id=\"statsBody\"></div></section>\n</main>\n<dialog id=\"modal\"></dialog>\n<dialog id=\"formDlg\"></dialog>\n<div id=\"toast\" class=\"toast\" hidden></div>\n\n<script>\nconst TYPES = { all: 'Tudo', movie: 'Filmes', series: 'Séries', anime: 'Animes', book: 'Livros' };\nconst STATUS = { planned: 'Quero ver/ler', 'in-progress': 'A ver/ler', done: 'Concluído', dropped: 'Abandonado' };\nconst SORTS = {\n  added: ['Mais recentes', (a, b) => (b.date_added || '').localeCompare(a.date_added || '')],\n  rating: ['Melhor nota', (a, b) => (b.rating ?? -1) - (a.rating ?? -1)],\n  year: ['Ano', (a, b) => (b.year || 0) - (a.year || 0)],\n  title: ['Título A–Z', (a, b) => (a.title || '').localeCompare(b.title || '', 'pt')],\n};\nconst ICON = { movie: '🎬', series: '📺', anime: '🌸', book: '📖' };\nconst $ = (s) => document.querySelector(s);\nconst esc = (s) => String(s ?? '').replace(/[&<>\"']/g, (c) => ({ '&': '&', '<': '<', '>': '>', '\"': '\"', \"'\": '&#39;' }[c]));\nconst safeUrl = (u) => (/^(https?:\\/\\/|covers\\/)/i.test(u || '') ? esc(u) : '');\nconst REPO = (() => {\n  const h = location.hostname, p = location.pathname.split('/')[1];\n  return h.endsWith('.github.io') && p ? `https://github.com/${h.split('.')[0]}/${p}` : null;\n})();\nconst fmtRating = (r) => (r == null ? '' : Number.isInteger(r) ? r : r.toFixed(1));\n\nlet items = [];\nconst state = { type: 'all', q: '', status: '', genre: '', tag: '', sort: 'added' };\nwindow.__movook = { reload: () => load(false), refreshActions };\n\nfunction lengthText(l) {\n  if (!l) return '';\n  const p = [];\n  if (l.runtime_min) p.push(`${l.runtime_min} min`);\n  if (l.seasons) p.push(`${l.seasons} temp.`);\n  if (l.episodes) p.push(`${l.episodes} ep.`);\n  if (l.pages) p.push(`${l.pages} págs.`);\n  return p.join(' · ');\n}\n\nfunction fillSelect(el, entries) {\n  el.innerHTML = entries.map(([v, l]) => `<option value=\"${esc(v)}\">${esc(l)}</option>`).join('');\n}\n\nfunction setupControls() {\n  $('#types').innerHTML = Object.entries(TYPES)\n    .map(([k, v]) => `<button data-type=\"${k}\" class=\"${k === state.type ? 'on' : ''}\">${v}</button>`).join('');\n  fillSelect($('#status'), [['', 'Todos os estados'], ...Object.entries(STATUS)]);\n  const genres = [...new Set(items.flatMap((i) => i.genres))].sort((a, b) => a.localeCompare(b, 'pt'));\n  fillSelect($('#genre'), [['', 'Todos os géneros'], ...genres.map((g) => [g, g])]);\n  const counts = {};\n  items.forEach((i) => i.tags.forEach((t) => (counts[t] = (counts[t] || 0) + 1)));\n  const tags = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pt'));\n  fillSelect($('#tag'), [['', 'Todas as tags'], ...tags.map(([t, n]) => [t, `${t} (${n})`])]);\n  $('#tag').hidden = tags.length === 0;\n  fillSelect($('#sort'), Object.entries(SORTS).map(([k, v]) => [k, v[0]]));\n}\n\nfunction filtered() {\n  const q = state.q.trim().toLowerCase();\n  return items\n    .filter((i) => state.type === 'all' || i.type === state.type)\n    .filter((i) => !state.status || i.status === state.status)\n    .filter((i) => !state.genre || i.genres.includes(state.genre))\n    .filter((i) => !state.tag || i.tags.includes(state.tag))\n    .filter((i) => !q || [i.title, i.original_title, ...i.creators, ...i.tags].join(' ').toLowerCase().includes(q))\n    .sort(SORTS[state.sort][1]);\n}\n\nfunction renderGrid() {\n  const list = filtered();\n  $('#empty').hidden = list.length > 0;\n  $('#grid').innerHTML = list.map((i) => `\n    <button class=\"card\" data-id=\"${esc(i.id)}\">\n      <div class=\"cover\">\n        ${safeUrl(i.cover) ? `<img src=\"${safeUrl(i.cover)}\" alt=\"\" loading=\"lazy\">` : ICON[i.type] || '📁'}\n        ${i.rating != null ? `<span class=\"badge\"><b>★</b> ${fmtRating(i.rating)}</span>` : ''}\n      </div>\n      <div class=\"info\"><strong>${esc(i.title)}</strong>\n        <small>${esc(i.year || '')} · ${esc(STATUS[i.status] || '')}</small></div>\n    </button>`).join('');\n}\n\nfunction openModal(id) {\n  const i = items.find((x) => x.id === id);\n  if (!i) return;\n  const chips = i.genres.map((g) => `<span class=\"chip\">${esc(g)}</span>`).join('') +\n    i.tags.map((t) => `<button class=\"chip tag\" data-tag=\"${esc(t)}\" title=\"Ver todos com esta tag\">#${esc(t)}</button>`).join('');\n  $('#modal').innerHTML = `<div class=\"m\">\n    <button class=\"close\" data-close>Fechar</button>\n    <div class=\"top\">\n      ${safeUrl(i.cover) ? `<img src=\"${safeUrl(i.cover)}\" alt=\"\">` : ''}\n      <div>\n        <h2>${esc(i.title)}</h2>\n        <div class=\"muted\">${esc([i.original_title !== i.title ? i.original_title : '', i.year, lengthText(i.length)].filter(Boolean).join(' · '))}</div>\n        <div class=\"muted\">${esc(i.creators.join(', '))}</div>\n        <p><b style=\"color:var(--star)\">★</b> ${i.rating != null ? fmtRating(i.rating) + '/10' : 'sem nota'} · ${esc(STATUS[i.status] || '')}\n        ${i.date_finished ? `<br><span class=\"muted\">Terminado em ${esc(i.date_finished)}</span>` : ''}</p>\n      </div>\n    </div>\n    <div class=\"chips\">${chips}</div>\n    ${i.review ? `<h3>A minha review</h3><div class=\"txt\">${esc(i.review)}</div>` : ''}\n    ${i.synopsis ? `<h3>Sinopse</h3><div class=\"txt\">${esc(i.synopsis)}</div>` : ''}\n    ${safeUrl(i.source_url) ? `<a href=\"${safeUrl(i.source_url)}\" target=\"_blank\" rel=\"noopener\">Ver na fonte ↗</a>` : ''}\n    ${(apiReady() || window.__movookAccount?.user)\n      ? `<div class=\"row\" style=\"justify-content:flex-start\"><button class=\"btn\" data-edit=\"${esc(i.id)}\">✏️ Editar</button><button class=\"btn danger\" data-remove=\"${esc(i.id)}\">🗑 Remover</button></div>`\n      : REPO ? `<a class=\"danger\" href=\"${REPO}/issues/new?template=remove-media.yml&items=${encodeURIComponent(i.id)}\" target=\"_blank\" rel=\"noopener\">🗑 Remover da biblioteca</a>` : ''}\n  </div>`;\n  $('#modal').showModal();\n}\n\nfunction renderStats() {\n  const done = items.filter((i) => i.status === 'done');\n  const rated = items.filter((i) => i.rating != null);\n  const avg = rated.length ? rated.reduce((s, i) => s + i.rating, 0) / rated.length : null;\n  const year = String(new Date().getFullYear());\n  const thisYear = done.filter((i) => String(i.date_finished || '').startsWith(year));\n  const count = (arr, f) => arr.reduce((m, i) => (f(i).forEach((k) => (m[k] = (m[k] || 0) + 1)), m), {});\n  const bars = (obj, n = 8) => {\n    const e = Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, n);\n    const max = e[0]?.[1] || 1;\n    return e.map(([k, v]) => `<div class=\"bar\"><span>${esc(k)}</span><i style=\"width:${(v / max) * 100}%\"></i><span>${v}</span></div>`).join('') || '<p class=\"muted\">Sem dados.</p>';\n  };\n  const gAvg = {};\n  rated.forEach((i) => i.genres.forEach((g) => (gAvg[g] = gAvg[g] || []).push(i.rating)));\n  const gAvgBest = Object.entries(gAvg).filter(([, v]) => v.length >= 2)\n    .map(([g, v]) => [g, +(v.reduce((a, b) => a + b, 0) / v.length).toFixed(1)]);\n  $('#statsBody').innerHTML = `\n    <div class=\"stats\">\n      <div class=\"stat\"><b>${items.length}</b><span>itens na biblioteca</span></div>\n      <div class=\"stat\"><b>${done.length}</b><span>concluídos</span></div>\n      <div class=\"stat\"><b>${thisYear.length}</b><span>concluídos em ${year}</span></div>\n      <div class=\"stat\"><b>${avg == null ? '–' : avg.toFixed(1)}</b><span>nota média</span></div>\n    </div>\n    <h2 class=\"sec\">Por tipo</h2>${bars(count(items, (i) => [TYPES[i.type] || i.type]))}\n    <h2 class=\"sec\">Géneros mais frequentes</h2>${bars(count(items, (i) => i.genres))}\n    <h2 class=\"sec\">Géneros com melhor nota média <span class=\"muted\">(mín. 2 itens avaliados)</span></h2>\n    ${gAvgBest.sort((a, b) => b[1] - a[1]).slice(0, 8).map(([g, v]) => `<div class=\"bar\"><span>${esc(g)}</span><i style=\"width:${v * 10}%\"></i><span>${v}</span></div>`).join('') || '<p class=\"muted\">Sem dados.</p>'}`;\n}\n\nfunction bind() {\n  $('#types').addEventListener('click', (e) => {\n    const t = e.target.closest('[data-type]'); if (!t) return;\n    state.type = t.dataset.type;\n    document.querySelectorAll('#types button').forEach((b) => b.classList.toggle('on', b === t));\n    renderGrid();\n  });\n  $('#q').addEventListener('input', (e) => { state.q = e.target.value; renderGrid(); });\n  for (const k of ['status', 'genre', 'tag', 'sort']) $('#' + k).addEventListener('change', (e) => { state[k] = e.target.value; renderGrid(); });\n  $('#grid').addEventListener('click', (e) => { const c = e.target.closest('[data-id]'); if (c) openModal(c.dataset.id); });\n  $('#modal').addEventListener('click', (e) => { if (e.target === e.currentTarget || e.target.hasAttribute('data-close')) $('#modal').close(); });\n  document.querySelectorAll('nav button[data-view]').forEach((b) => b.addEventListener('click', () => {\n    document.querySelectorAll('nav button[data-view]').forEach((x) => x.classList.toggle('on', x === b));\n    $('#library').hidden = b.dataset.view !== 'library';\n    $('#stats').hidden = b.dataset.view !== 'stats';\n  }));\n}\n\nconst CFG_KEY = 'mobook.cfg';\nfunction getCfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch { return {}; } }\nfunction apiReady() { const c = getCfg(); return !!(c.url && c.secret); }\n\nlet toastTimer;\nfunction toast(msg) {\n  const t = $('#toast'); t.textContent = msg; t.hidden = false;\n  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 6000);\n}\n\nasync function api(path, payload) {\n  const c = getCfg();\n  let res;\n  try {\n    res = await fetch(c.url.replace(/\\/+$/, '') + path, {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + c.secret },\n      body: JSON.stringify(payload),\n    });\n  } catch { throw new Error('Sem ligação ao servidor (estás offline?)'); }\n  const j = await res.json().catch(() => ({}));\n  if (!res.ok) throw new Error(j.error || `Erro ${res.status}`);\n  return j;\n}\n\nfunction refreshActions() {\n  const ready = apiReady() || !!window.__movookAccount?.user;\n  $('#addBtn').hidden = !ready;\n  $('#addLink').hidden = ready || !REPO;\n  if (REPO) $('#addLink').href = `${REPO}/issues/new?template=add-media.yml`;\n}\n\nconst dlg = $('#formDlg');\ndlg.addEventListener('click', (e) => { if (e.target === dlg || e.target.hasAttribute('data-cancel')) dlg.close(); });\n\nfunction openAdd() {\n  dlg.innerHTML = `<form class=\"m form\" id=\"addForm\">\n    <h2>Adicionar à biblioteca</h2>\n    <label>Tipo<select id=\"fType\">\n      <option value=\"movie\">Filme</option><option value=\"series\">Série</option>\n      <option value=\"anime\">Anime</option><option value=\"book\">Livro</option></select></label>\n    <label>Títulos (um por linha, máx. 30)<textarea id=\"fTitles\" required placeholder=\"Frieren&#10;Dune | 2021\"></textarea></label>\n    <label>Estado<select id=\"fStatus\">\n      <option value=\"planned\">Quero ver/ler</option><option value=\"in-progress\">A ver/ler</option>\n      <option value=\"done\">Concluído</option><option value=\"dropped\">Abandonado</option></select></label>\n    <label>Nota 0–10 (opcional, só com 1 título)<input id=\"fRating\" type=\"number\" min=\"0\" max=\"10\" step=\"0.1\" inputmode=\"decimal\"></label>\n    <label>Review (opcional, só com 1 título)<textarea id=\"fReview\"></textarea></label>\n    <div class=\"row\"><button type=\"button\" class=\"btn\" data-cancel>Cancelar</button>\n      <button type=\"submit\" class=\"btn fill\">Adicionar</button></div></form>`;\n  dlg.showModal();\n  $('#addForm').addEventListener('submit', async (e) => {\n    e.preventDefault();\n    const btn = e.target.querySelector('[type=submit]'); btn.disabled = true;\n    const titles = $('#fTitles').value.split(/\\r?\\n/).map((s) => s.trim()).filter(Boolean);\n    const acct = window.__movookAccount;\n    try {\n      if (acct?.user) {\n        const status = $('#fStatus').value;\n        const rating = $('#fRating').value ? parseFloat($('#fRating').value) : null;\n        const review = $('#fReview').value;\n        for (const t of titles) {\n          await acct.addPersonal({\n            type: $('#fType').value, title: t, original_title: t, year: null, creators: [], genres: [], tags: [],\n            rating: titles.length === 1 ? rating : null, status,\n            date_added: new Date().toISOString().slice(0, 10),\n            date_finished: status === 'done' ? new Date().toISOString().slice(0, 10) : '',\n            review: titles.length === 1 ? review : '', synopsis: '', cover: '', source_url: '', length: {},\n          });\n        }\n        dlg.close();\n        toast(`Adicionado à tua biblioteca (${titles.length}).`);\n      } else {\n        await api('/add', { type: $('#fType').value, titles, status: $('#fStatus').value, rating: $('#fRating').value, review: $('#fReview').value });\n        dlg.close();\n        toast(`Pedido enviado (${titles.length}). O site atualiza em 1–2 min; depois toca em ↻.`);\n      }\n    } catch (err) { btn.disabled = false; toast('Erro: ' + err.message); }\n  });\n}\n\nfunction openCfg() {\n  const c = getCfg();\n  dlg.innerHTML = `<form class=\"m form\" id=\"cfgForm\">\n    <h2>Definições</h2>\n    <p class=\"muted\">Para adicionar e remover a partir da app. Fica guardado só neste dispositivo.</p>\n    <label>Endereço do Worker<input id=\"cUrl\" type=\"url\" placeholder=\"https://mobook-api.xxx.workers.dev\"></label>\n    <label>Passphrase<input id=\"cSecret\" type=\"password\" autocomplete=\"off\"></label>\n    <div class=\"row\"><button type=\"button\" class=\"btn danger\" id=\"cClear\">Limpar</button>\n      <button type=\"button\" class=\"btn\" data-cancel>Cancelar</button>\n      <button type=\"submit\" class=\"btn fill\">Guardar</button></div></form>`;\n  $('#cUrl').value = c.url || ''; $('#cSecret').value = c.secret || '';\n  dlg.showModal();\n  $('#cfgForm').addEventListener('submit', (e) => {\n    e.preventDefault();\n    localStorage.setItem(CFG_KEY, JSON.stringify({ url: $('#cUrl').value.trim(), secret: $('#cSecret').value }));\n    dlg.close(); refreshActions(); toast('Guardado.');\n  });\n  $('#cClear').addEventListener('click', () => { localStorage.removeItem(CFG_KEY); dlg.close(); refreshActions(); toast('Definições removidas.'); });\n}\n\n$('#modal').addEventListener('click', (e) => {\n  const t = e.target.dataset?.tag; if (t === undefined) return;\n  Object.assign(state, { type: 'all', q: '', status: '', genre: '', tag: t });\n  $('#q').value = ''; $('#status').value = ''; $('#genre').value = ''; $('#tag').value = t;\n  document.querySelectorAll('#types button').forEach((b) => b.classList.toggle('on', b.dataset.type === 'all'));\n  $('#modal').close();\n  document.querySelector('nav button[data-view=library]').click();\n  renderGrid(); window.scrollTo(0, 0);\n});\n\nfunction openEdit(id) {\n  const it = items.find((x) => x.id === id); if (!it) return;\n  dlg.innerHTML = `<form class=\"m form\" id=\"editForm\">\n    <h2>Editar</h2><div class=\"muted\" id=\"eTitle\"></div>\n    <label>Estado<select id=\"eStatus\">\n      <option value=\"planned\">Quero ver/ler</option><option value=\"in-progress\">A ver/ler</option>\n      <option value=\"done\">Concluído</option><option value=\"dropped\">Abandonado</option></select></label>\n    <label>Nota 0–10<input id=\"eRating\" type=\"number\" min=\"0\" max=\"10\" step=\"0.1\" inputmode=\"decimal\"></label>\n    <label>Data de conclusão<input id=\"eDate\" type=\"date\"></label>\n    <label>Tags (separadas por vírgulas)<input id=\"eTags\" type=\"text\" placeholder=\"slow burn, sci-fi filosófico\"></label>\n    <label>Review<textarea id=\"eReview\" style=\"min-height:140px\"></textarea></label>\n    <div class=\"row\"><button type=\"button\" class=\"btn\" data-cancel>Cancelar</button>\n      <button type=\"submit\" class=\"btn fill\">Guardar</button></div></form>`;\n  $('#eTitle').textContent = it.title;\n  $('#eStatus').value = it.status || 'planned';\n  $('#eRating').value = it.rating ?? '';\n  $('#eDate').value = /^\\d{4}-\\d{2}-\\d{2}$/.test(it.date_finished || '') ? it.date_finished : '';\n  $('#eTags').value = it.tags.join(', ');\n  $('#eReview').value = it.review || '';\n  dlg.showModal();\n  $('#editForm').addEventListener('submit', async (e) => {\n    e.preventDefault();\n    const btn = e.target.querySelector('[type=submit]'); btn.disabled = true;\n    const patch = {\n      status: $('#eStatus').value,\n      rating: $('#eRating').value ? parseFloat($('#eRating').value) : null,\n      date_finished: $('#eDate').value,\n      tags: $('#eTags').value.split(',').map((s) => s.trim()).filter(Boolean),\n      review: $('#eReview').value,\n    };\n    try {\n      if (window.__movookAccount?.user) {\n        await window.__movookAccount.updatePersonal(id, patch);\n        dlg.close(); $('#modal').close();\n        toast('Alterações guardadas na tua biblioteca.');\n      } else {\n        await api('/edit', { id, ...patch });\n        dlg.close(); $('#modal').close();\n        toast('Edição enviada. O site atualiza em 1–2 min; depois toca em ↻.');\n      }\n    } catch (err) { btn.disabled = false; toast('Erro: ' + err.message); }\n  });\n}\n\n$('#modal').addEventListener('click', (e) => { const id = e.target.dataset?.edit; if (id) openEdit(id); });\n$('#addBtn').addEventListener('click', openAdd);\n$('#cfgBtn').addEventListener('click', openCfg);\n$('#modal').addEventListener('click', async (e) => {\n  const id = e.target.dataset?.remove; if (!id) return;\n  const it = items.find((x) => x.id === id);\n  if (!confirm(`Remover \"${it ? it.title : id}\" da biblioteca?`)) return;\n  e.target.disabled = true;\n  try {\n    if (window.__movookAccount?.user) {\n      await window.__movookAccount.removePersonal(id);\n      $('#modal').close();\n      toast('Removido da tua biblioteca.');\n    } else {\n      await api('/remove', { items: [id] });\n      $('#modal').close();\n      toast('Pedido de remoção enviado. O site atualiza em 1–2 min; depois toca em ↻.');\n    }\n  } catch (err) { e.target.disabled = false; toast('Erro: ' + err.message); }\n});\nrefreshActions();\nif ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});\n\nlet insights = null;\nconst TYPE_ONE = { movie: 'Filme', series: 'Série', anime: 'Anime', book: 'Livro' };\n\nfunction renderInsights() {\n  const el = $('#insights');\n  const s = insights?.summary, recs = insights?.recommendations || [];\n  if (!s?.text && !recs.length) { el.innerHTML = ''; return; }\n  const ready = apiReady() || !!window.__movookAccount?.user;\n  el.innerHTML = `\n    ${s?.text ? `<h2 class=\"sec\">✨ Resumo de ${esc(s.year)}</h2><div class=\"stat txt\">${esc(s.text)}</div>` : ''}\n    ${recs.length ? `<h2 class=\"sec\">Para ti <span class=\"muted\">(sugestões geradas por AI)</span></h2>\n      <div class=\"recs\">${recs.map((r, k) => `<div class=\"stat\">\n        <strong>${esc(r.title)}</strong>\n        <span class=\"muted\">${esc(r.year)} · ${esc(TYPE_ONE[r.type] || r.type)}</span>\n        <div class=\"muted\">${esc(r.why)}</div>\n        ${ready ? `<button class=\"btn\" data-rec=\"${k}\">+ Adicionar</button>` : ''}</div>`).join('')}</div>` : ''}`;\n}\n\nfunction loadInsights() {\n  return fetch('insights.json', { cache: 'no-cache' })\n    .then((r) => (r.ok ? r.json() : null)).catch(() => null)\n    .then((j) => { insights = j; renderInsights(); });\n}\n\n$('#insights').addEventListener('click', async (e) => {\n  const k = e.target.dataset?.rec; if (k === undefined) return;\n  const r = insights.recommendations[k];\n  e.target.disabled = true;\n  try {\n    if (window.__movookAccount?.user) {\n      await window.__movookAccount.addPersonal({\n        type: r.type, title: r.title, original_title: r.title, year: r.year, creators: [], genres: [], tags: [],\n        rating: null, status: 'planned', date_added: new Date().toISOString().slice(0, 10), date_finished: '',\n        review: '', synopsis: '', cover: '', source_url: '', length: {},\n      });\n      toast(`\"${r.title}\" adicionado à tua biblioteca.`);\n    } else {\n      await api('/add', { type: r.type, titles: [`${r.title.replace(/\\|/g, ' ')} | ${r.year}`], status: 'planned' });\n      toast(`\"${r.title}\" enviado para a biblioteca. O site atualiza em 1–2 min; depois toca em ↻.`);\n    }\n  } catch (err) { e.target.disabled = false; toast('Erro: ' + err.message); }\n});\n\nfunction load(first) {\n  const acct = window.__movookAccount;\n  if (acct?.user) {\n    items = acct.items || [];\n    Object.assign(state, { type: 'all', q: '', status: '', genre: '', tag: '', sort: 'added' });\n    $('#q').value = '';\n    setupControls(); if (first) bind(); renderGrid(); renderStats(); loadInsights();\n    return;\n  }\n  return fetch('data.json', { cache: 'no-cache' }).then((r) => r.json()).then((d) => {\n    items = d.items;\n    Object.assign(state, { type: 'all', q: '', status: '', genre: '', tag: '', sort: 'added' });\n    $('#q').value = '';\n    setupControls(); if (first) bind(); renderGrid(); renderStats(); loadInsights();\n  }).catch(() => { $('#grid').innerHTML = '<p class=\"muted\">Não foi possível carregar os dados.</p>'; });\n}\n$('#refreshBtn').addEventListener('click', () => load(false).then(() => toast('Atualizado.')));\nload(true);\n</script>\n<script>\n(() => {\n  const FAV_KEY = 'mobook.favorites';\n  const SHELF_KEY = 'mobook.shelves';\n  const VIEW_KEY = 'mobook.view';\n  const SCROLL_KEY = 'mobook.scroll';\n  const $ = (s) => document.querySelector(s);\n  const esc = (s) => String(s ?? '').replace(/[&<>\"']/g, (c) => ({ '&': '&', '<': '<', '>': '>', '\"': '\"', \"'\": '&#39;' }[c]));\n  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };\n  const store = (k, v) => localStorage.setItem(k, JSON.stringify(v));\n  let favs = new Set(load(FAV_KEY, []));\n  let shelves = load(SHELF_KEY, []);\n  let activeShelf = 'favorites';\n  const ICON = { movie: '🎬', series: '📺', anime: '🌸', book: '📖' };\n  const STATUS = { planned: 'Quero ver/ler', 'in-progress': 'A ver/ler', done: 'Concluído', dropped: 'Abandonado' };\n\n  const nav = document.querySelector('header nav');\n  const shelvesBtn = document.createElement('button');\n  shelvesBtn.dataset.view = 'shelves';\n  shelvesBtn.textContent = 'Estantes';\n  nav.querySelector('[data-view=\"stats\"]')?.after(shelvesBtn);\n\n  const main = document.querySelector('main');\n  const sec = document.createElement('section');\n  sec.id = 'shelves';\n  sec.hidden = true;\n  sec.innerHTML = '<div class=\"shelf-add\"><input id=\"shelfName\" placeholder=\"Nova estante…\"><button class=\"btn\" id=\"shelfCreate\">Criar</button></div><div class=\"tabs\" id=\"shelfTabs\"></div><div class=\"shelf-add\"><select id=\"shelfItem\"></select><button class=\"btn\" id=\"shelfAdd\">Adicionar</button></div><div id=\"shelfGrid\" class=\"grid\"></div><p id=\"shelfEmpty\" class=\"muted\" hidden>Sem itens nesta estante.</p>';\n  main.append(sec);\n\n  const shelfItems = (id) => id === 'favorites'\n    ? items.filter((i) => favs.has(i.id))\n    : items.filter((i) => (shelves.find((s) => s.id === id)?.items || []).includes(i.id));\n\n  function renderShelves() {\n    const tabs = [['favorites', 'Favoritos'], ...shelves.map((s) => [s.id, s.name])];\n    $('#shelfTabs').innerHTML = tabs.map(([id, name]) => `<button data-shelf=\"${esc(id)}\" class=\"${id === activeShelf ? 'on' : ''}\">${esc(name)}</button>`).join('');\n    $('#shelfItem').innerHTML = '<option value=\"\">Adicionar à estante…</option>' + items.map((i) => `<option value=\"${esc(i.id)}\">${esc(i.title)}</option>`).join('');\n    const list = shelfItems(activeShelf);\n    $('#shelfEmpty').hidden = list.length > 0;\n    $('#shelfGrid').innerHTML = list.map((i) => `\n      <button class=\"card\" data-id=\"${esc(i.id)}\">\n        <div class=\"cover\">${safeUrl(i.cover) ? `<img src=\"${safeUrl(i.cover)}\" alt=\"\" loading=\"lazy\">` : (ICON[i.type] || '📁')}</div>\n        <div class=\"info\"><strong>${esc(i.title)}</strong><small>${esc(STATUS[i.status] || '')}</small></div>\n      </button>`).join('');\n  }\n\n  function toggleFav(id) {\n    favs.has(id) ? favs.delete(id) : favs.add(id);\n    store(FAV_KEY, [...favs]);\n    renderShelves();\n  }\n\n  const grid = $('#grid');\n  new MutationObserver(() => {\n    for (const card of grid.querySelectorAll('.card:not([data-fav])')) {\n      card.dataset.fav = '1';\n      const id = card.dataset.id;\n      const b = document.createElement('button');\n      b.className = 'fav'; b.type = 'button';\n      b.textContent = favs.has(id) ? '♥' : '♡';\n      b.onclick = (e) => { e.stopPropagation(); toggleFav(id); b.textContent = favs.has(id) ? '♥' : '♡'; };\n      card.querySelector('.cover')?.append(b);\n    }\n  }).observe(grid, { childList: true });\n\n  shelvesBtn.addEventListener('click', () => {\n    document.querySelectorAll('nav button[data-view]').forEach((b) => b.classList.toggle('on', b === shelvesBtn));\n    $('#library').hidden = true; $('#stats').hidden = true; sec.hidden = false;\n    sessionStorage.setItem(VIEW_KEY, 'shelves');\n    renderShelves();\n  });\n  nav.addEventListener('click', (e) => {\n    const b = e.target.closest('button[data-view]');\n    if (!b) return;\n    if (b !== shelvesBtn) sec.hidden = true;\n    sessionStorage.setItem(VIEW_KEY, b.dataset.view);\n  });\n\n  $('#shelfTabs').addEventListener('click', (e) => {\n    const t = e.target.closest('[data-shelf]'); if (!t) return;\n    activeShelf = t.dataset.shelf; renderShelves();\n  });\n  $('#shelfCreate').addEventListener('click', () => {\n    const name = $('#shelfName').value.trim(); if (!name) return;\n    const id = 'shelf_' + Date.now();\n    shelves.push({ id, name, items: [] });\n    store(SHELF_KEY, shelves);\n    $('#shelfName').value = ''; activeShelf = id; renderShelves();\n  });\n  $('#shelfAdd').addEventListener('click', () => {\n    const id = $('#shelfItem').value; if (!id) return;\n    if (activeShelf === 'favorites') { favs.add(id); store(FAV_KEY, [...favs]); }\n    else {\n      const sh = shelves.find((s) => s.id === activeShelf); if (!sh) return;\n      sh.items = sh.items || [];\n      if (!sh.items.includes(id)) sh.items.push(id);\n      store(SHELF_KEY, shelves);\n    }\n    renderShelves();\n  });\n  $('#shelfGrid').addEventListener('click', (e) => {\n    const c = e.target.closest('[data-id]'); if (c) openModal(c.dataset.id);\n  });\n\n  let scrollTimer;\n  const saveScroll = () => { try { sessionStorage.setItem(SCROLL_KEY, String(window.scrollY)); } catch {} };\n  addEventListener('scroll', () => { clearTimeout(scrollTimer); scrollTimer = setTimeout(saveScroll, 150); }, { passive: true });\n  addEventListener('pagehide', saveScroll);\n  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveScroll(); });\n  function restoreScroll() {\n    const y = parseInt(sessionStorage.getItem(SCROLL_KEY) || '0', 10);\n    if (y > 0) window.scrollTo(0, y);\n  }\n  addEventListener('pageshow', () => {\n    let n = 0;\n    const t = setInterval(() => { restoreScroll(); if (++n > 25) clearInterval(t); }, 120);\n  });\n\n  renderShelves();\n  const savedView = sessionStorage.getItem(VIEW_KEY);\n  if (savedView === 'shelves') shelvesBtn.click();\n})();\n</script>\n</body>\n</html>
