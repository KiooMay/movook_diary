<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar palavra-passe — MOVOOK</title><style>
:root{color-scheme:light;--bg:#f6f5f2;--card:#fff;--text:#1c1c22;--muted:#6b6b76;--line:#e2e0da;--accent:#5b4bdb;--movook-accent-ink:#fff}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14141a;--card:#1e1e26;--text:#ececf1;--muted:#9a9aa8;--line:#2e2e3a;--accent:#8b7dff;--movook-accent-ink:#14141a}}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:24px 16px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}main{max-width:440px;margin:32px auto;padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--card)}h1{font-size:1.25rem;margin:0 0 16px}form{display:grid;gap:16px}label{display:grid;gap:4px;font-size:.875rem}input,button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px}input{width:100%;background:var(--bg)}button{background:var(--accent);color:var(--movook-accent-ink);cursor:pointer}button:disabled{opacity:.6;cursor:wait}p{font-size:.9rem}a{color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style><link rel="stylesheet" href="library-extras.css"></head><body><main data-recovery-page><h1>Recuperar palavra-passe</h1><p id="recovery-status" role="status" aria-live="polite">A preparar a recuperação…</p><form id="recovery-request" hidden><label>Email da conta<input name="email" type="email" required autocomplete="email" maxlength="254"></label><button type="submit">Enviar link de recuperação</button></form><form id="recovery-change" hidden><label>Nova palavra-passe<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><label>Confirmar nova palavra-passe<input name="confirmation" type="password" required minlength="8" autocomplete="new-password"></label><button type="submit">Guardar nova palavra-passe</button></form><p><a href="./">Voltar ao MOVOOK</a></p></main><script type="module" src="password-recovery.mjs"></script></body></html>
